<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="R&C Create Appsのサポートおよびプライバシーポリシー">
  <title>R&C Create Apps</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f2eb;
      color: #1f2926;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.7;
    }
    main { max-width: 720px; margin: 0 auto; padding: 56px 24px 72px; }
    header { border-bottom: 2px solid #1f2926; padding-bottom: 28px; margin-bottom: 42px; }
    .mark { color: #2f6f67; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.08em; }
    h1 { margin: 8px 0 0; font-size: 2rem; line-height: 1.25; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 1.25rem; letter-spacing: 0; }
    section { margin-top: 34px; }
    .links { display: grid; gap: 12px; margin-top: 22px; }
    a.card {
      display: block;
      border: 1px solid #8a9187;
      border-left: 5px solid #2f6f67;
      color: inherit;
      padding: 18px;
      text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { background: #e5ede7; outline: 3px solid #2f6f67; outline-offset: 2px; }
    .card strong { display: block; font-size: 1.05rem; }
    .card span { color: #4e5a55; font-size: 0.95rem; }
    footer { border-top: 1px solid #8a9187; color: #4e5a55; font-size: 0.85rem; margin-top: 52px; padding-top: 18px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">R&amp;C CREATE APPS</div>
      <h1>サポートとプライバシー</h1>
    </header>
    <section>
      <h2>仕訳クエスト</h2>
      <p>簿記3級の基本仕訳を、ゲーム感覚で練習するための学習補助アプリです。</p>
      <div class="links">
        <a class="card" href="privacy.html">
          <strong>プライバシーポリシー</strong>
          <span>アプリが扱う情報と、端末内データについて</span>
        </a>
        <a class="card" href="support.html">
          <strong>サポート・お問い合わせ</strong>
          <span>ご質問、不具合報告、改善案の連絡先</span>
        </a>
      </div>
    </section>
    <footer>R&amp;C Create Apps</footer>
  </main>
</body>
</html>
